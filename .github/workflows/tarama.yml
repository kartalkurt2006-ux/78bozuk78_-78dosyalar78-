name: BIST Tarama Sistemi

on:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manuel olarak GitHub panelinden tetiklenebilmesini sağlar

jobs:
  tarama:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pytz requests

      - name: Tarama Scriptini Çalıştır
        run: |
          python main.py
