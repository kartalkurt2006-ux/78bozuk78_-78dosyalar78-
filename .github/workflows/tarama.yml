name: BIST Tarama Botu

on:
  schedule:
    # Türkiye saati ile 09:00 - 18:30 arası her 15 dakikada bir (UTC 06:00 - 15:30)
    - cron: '*/15 6-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarama_yap:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests yfinance pandas pytz numpy

      - name: Botu Çalıştır
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python main.py

      - name: Hafıza Dosyasını Kaydet ve Push Yap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch borsa_hafiza.json
          git add borsa_hafiza.json
          git commit -m "Otomatik hafiza guncellemesi [skip ci]" || echo "Degisiklik yok"
          git pull origin main --rebase || echo "Pull atlanıyor"
          git push origin main || echo "Push atlanıyor"
