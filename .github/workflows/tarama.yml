name: BIST Tarama Botu

on:
  schedule:
    # Pazartesi - Cuma günleri arası, saat 09:00 - 19:30 (UTC saati ile 06:00 - 16:30 arası) 
    # ve her 15 dakikada bir çalışacak şekilde ayarlandı:
    - cron: '*/15 6-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarama_yap:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Botu Çalıştır
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python main.py

      - name: Hafıza Dosyasını Kaydet ve Push Yap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add borsa_hafiza.json
          git commit -m "Otomatik hafiza guncellemesi [skip ci]" || echo "Degisiklik yok"
          git pull origin main --rebase || echo "Pull yapilamadi veya gerek yok"
          git push origin main || echo "Push yapilamadi"
